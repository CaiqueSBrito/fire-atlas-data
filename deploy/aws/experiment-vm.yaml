AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fire-atlas-data experiment and lake-maintenance VM. One on-demand EC2 instance with an
  instance profile that reads the lake and writes only under experiments/, gold/harmonized/ and
  gold/map_grid/. SSH only from one /32. Delete the stack to stop billing; the root volume is
  deleted with the instance, results must be copied to S3 first.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  LakeBucket:
    Type: String
    Default: data-lake-fire-atlas-553607359608-us-east-2-an
  InstanceType:
    Type: String
    Default: r7a.8xlarge
  Market:
    Type: String
    Default: on-demand
    AllowedValues: [on-demand, spot]
    Description: >-
      spot = persistent request that stops (keeps the EBS volume) on interruption and restarts when capacity
      returns; for when the On-Demand vCPU quota is too small. The request outlives the instance: before
      deleting the stack or switching back to on-demand, cancel it (aws ec2 cancel-spot-instance-requests),
      otherwise it launches a new, unmanaged instance that also blocks the security group deletion.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  VolumeGiB:
    Type: Number
    Default: 400
  SshCidr:
    Type: String
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/32$'
    Description: The single operator address allowed on TCP 22.
  SshPublicKey:
    Type: String
    Description: OpenSSH public key imported as this stack's key pair.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet with an internet route; the instance gets a public IP.

Conditions:
  UseSpot: !Equals [!Ref Market, spot]

Resources:
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-key"
      PublicKeyMaterial: !Ref SshPublicKey

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: fire-atlas experiment VM, SSH from the operator only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lake-experiments
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}"
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/prata/silver/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/coverage/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/models/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/reference/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/experiments/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/gold/harmonized/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/gold/map_grid/*"
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/experiments/*"
                  # full rebuilds of the harmonized tables (too large for the Fargate daily job)
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/gold/harmonized/*"
                  # atomic repartition of the existing map; never vacuum during migration
                  - !Sub "arn:${AWS::Partition}:s3:::${LakeBucket}/gold/map_grid/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !Ref ImageId
        KeyName: !Ref KeyPair
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        InstanceMarketOptions: !If
          - UseSpot
          - MarketType: spot
            SpotOptions:
              SpotInstanceType: persistent
              InstanceInterruptionBehavior: stop
          - !Ref AWS::NoValue
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        NetworkInterfaces:
          - DeviceIndex: 0
            SubnetId: !Ref SubnetId
            AssociatePublicIpAddress: true
            Groups: [!Ref SecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref VolumeGiB
              Iops: 6000
              Throughput: 500
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${AWS::StackName}"
              - Key: project
                Value: fire-atlas-data

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
